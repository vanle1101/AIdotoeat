name: phase-09-ci

on:
  push:
    branches: ["codex/autoprofit-phase-09-production-readiness"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt
      - name: Install isolated Chromium runtime for screenshot-backed product tests
        run: python -m playwright install --with-deps chromium
      - name: Compile Python sources
        run: python -m compileall -q backend core modules scripts tests
      - name: Run tests
        run: python -m pytest -q
      - name: Vulnerability and license audit
        run: |
          pip-audit --requirement requirements-dev.lock.txt --format=json --output=docs/evidence/phase09/pip-audit.json
          python scripts/license_audit.py --lock requirements-dev.lock.txt --strict-installed --output docs/evidence/phase09/licenses.json
      - name: Run isolated production-readiness E2E
        run: |
          python scripts/phase09_e2e.py --output-dir "$RUNNER_TEMP/phase09-output" --evidence "$RUNNER_TEMP/phase09-e2e.json"
      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase09-evidence
          path: |
            ${{ runner.temp }}/phase09-e2e.json
            docs/evidence/phase09/pip-audit.json
            docs/evidence/phase09/licenses.json
          if-no-files-found: warn
          retention-days: 30
