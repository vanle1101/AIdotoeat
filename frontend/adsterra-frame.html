<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Ad Network · Chưa cấu hình</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; min-height: 40px; margin: 0; overflow: hidden; background: #07172a; color: #b5cde0; font: 11px/1.2 "Segoe UI", Arial, sans-serif; }
    body { display: grid; place-items: center; }
    p { margin: 0; padding: 6px 12px; border: 1px solid #17476a; border-radius: 7px; background: linear-gradient(110deg, #0a2037, #0a1a30); }
    strong { color: #72d8f4; font-weight: 700; }
  </style>
</head>
<body>
  <p role="status"><strong>Ad Network</strong> · Chưa cấu hình đơn vị quảng cáo</p>
</body>
</html>
