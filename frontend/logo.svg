<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="ap2099_cyber_ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#b026ff" />
      <stop offset="100%" stop-color="#ff00a0" />
    </linearGradient>
    <linearGradient id="ap2099_gold_bolt" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9d" />
      <stop offset="55%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#ffe600" />
    </linearGradient>
    <radialGradient id="ap2099_core_bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0c1938" />
      <stop offset="70%" stop-color="#050917" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>
    <filter id="ap2099_glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Hexagonal Reactor Core -->
  <polygon points="60,5 108,32 108,88 60,115 12,88 12,32" fill="url(#ap2099_core_bg)" stroke="url(#ap2099_cyber_ring)" stroke-width="3.5" filter="url(#ap2099_glow)" />
  <!-- Orbital Energy Ring -->
  <circle cx="60" cy="60" r="44" fill="none" stroke="#00f3ff" stroke-width="1.8" stroke-dasharray="18 8 6 8" opacity="0.85">
    <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="14s" repeatCount="indefinite" />
  </circle>
  <circle cx="60" cy="60" r="38" fill="none" stroke="#ff00a0" stroke-width="1.4" stroke-dasharray="10 14" opacity="0.75">
    <animateTransform attributeName="transform" type="rotate" from="360 60 60" to="0 60 60" dur="10s" repeatCount="indefinite" />
  </circle>
  <!-- Stylized Futuristic 'A' + 'P' Monogram -->
  <path d="M34 84 L54 32 L64 32 L84 84 L73 84 L68 70 L49 70 L44 84 Z M52 60 L65 60 L59 42 Z" fill="url(#ap2099_cyber_ring)" filter="url(#ap2099_glow)" />
  <!-- Rising Profit Chart Arrow & Lightning Bolt -->
  <path d="M28 76 L48 56 L62 64 L88 34 L88 48 M88 34 L74 34" fill="none" stroke="url(#ap2099_gold_bolt)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#ap2099_glow)" />
  <!-- AI Quantum Core Node -->
  <circle cx="59" cy="24" r="4.5" fill="#00ff9d" filter="url(#ap2099_glow)">
    <animate attributeName="r" values="3.8;5.5;3.8" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>