# Local-only canary. It does not bind, replace, or reload the existing public
# port 8888/80/443 virtual hosts. Use an already-configured TLS front proxy if
# a human needs browser access; never expose owner routes over plain HTTP.
server {
    listen 127.0.0.1:8889;
    server_name localhost;
    root /var/www/autoprofit-canary/current/frontend;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8451;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 75s;
        proxy_send_timeout 15s;
    }

    location /apps/ {
        alias /var/www/autoprofit-canary/current/frontend/apps/;
        try_files $uri =404;
        autoindex off;
    }

    location ~* \.(?:env|pem|key|sqlite|db|log)$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
