# Standalone Nginx instance for a loopback-only canary. It does not include
# the host's global Nginx configuration or alter/reload production vhosts.
worker_processes 1;
pid /run/autoprofit-canary-nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;

    client_body_temp_path /run/autoprofit-canary-nginx/client_temp;
    proxy_temp_path /run/autoprofit-canary-nginx/proxy_temp;
    fastcgi_temp_path /run/autoprofit-canary-nginx/fastcgi_temp;
    uwsgi_temp_path /run/autoprofit-canary-nginx/uwsgi_temp;
    scgi_temp_path /run/autoprofit-canary-nginx/scgi_temp;

    include /var/www/autoprofit-canary/current/deploy/nginx/autoprofit-canary.conf;
}
