# Project-only production entrypoints. The port 80 ACME challenge and HTTPS
# redirect stay in the separately managed autoprofit-phase11-acme.conf vhost.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name autoprofit.160.22.107.108.sslip.io;
    ssl_certificate /etc/letsencrypt/live/autoprofit-phase11-sslip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autoprofit-phase11-sslip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AUTOPROFIT_PHASE11_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;

    root /var/www/autoprofit/current/frontend;
    index index.html;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8450;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 75s;
        proxy_send_timeout 15s;
    }

    location /apps/ {
        alias /var/lib/autoprofit/apps/;
        try_files $uri =404;
        autoindex off;
    }

    location ~* \.(?:env|pem|key|sqlite|db|log)$ { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}

# The legacy application port is plaintext only; redirect it to the covered
# hostname without changing the separate applications on ports 80/443/8000.
server {
    listen 8888 default_server;
    listen [::]:8888 default_server;
    server_name _;
    return 301 https://autoprofit.160.22.107.108.sslip.io$request_uri;
}
